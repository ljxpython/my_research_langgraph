[project]
name = "my-research-langgraph"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain[openai]>=1.2.7",
    "langchain-community>=0.4.1",
    "langchain-mcp-adapters>=0.2.1",
    "langgraph>=1.0.7",
    "pypdf>=6.6.2",
    "langgraph-cli[inmem]>=0.4.12",
    "deepagents>=0.3.9",
    "langchain-deepseek>=1.0.1",
    "fastapi>=0.128.0",
    "uvicorn[standard]>=0.40.0",
    "requests>=2.32.5",
    "python-dotenv>=1.2.1",
]


[tool.uv.workspace]
# Monorepo workspace. Default: use ONE shared root .venv + a single uv.lock.
# Each subproject keeps its own pyproject.toml, but uv sync/run happens from root.
members = [
    "control_plane",
    "execution_plane",
]
